name: Rotate Muse beta
on:
  pull_request:
    paths: ['RotateMuse/**', '.github/workflows/rotate-muse.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Set up Android SDK explicitly
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          log-accepted-android-sdk-licenses: false
      - name: Install compile platform
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Test, lint, build
        working-directory: RotateMuse
        run: gradle --no-daemon --max-workers=1 :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Rotate-Muse-beta
          path: |
            RotateMuse/app/build/outputs/apk/debug/*.apk
            RotateMuse/app/build/test-results/
            RotateMuse/app/build/reports/lint-results-debug.*

