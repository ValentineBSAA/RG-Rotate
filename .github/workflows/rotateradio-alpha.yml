name: RotateRadio Android Studio 0.3.0
on:
  push:
    branches: [rotateradio-v0.3.0]
    paths:
      - 'RotateRadio/**'
      - '.github/workflows/rotateradio-alpha.yml'
  workflow_dispatch:
concurrency:
  group: rotateradio-alpha-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK explicitly
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          log-accepted-android-sdk-licenses: false
      - name: Install Android platform and NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Install and verify host build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg file unzip
          for tool in git cargo rustup ffmpeg ffprobe file unzip sha256sum java gradle sdkmanager; do command -v "$tool"; done
          test -x "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          ffmpeg -version | sed -n '1p'
      - name: Build and smoke-test encoder on Linux
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/liangchunn/atracdenc-rs.git "$RUNNER_TEMP/atracdenc"
          cd "$RUNNER_TEMP/atracdenc"
          git checkout --detach 39118d6619b073c8382360b9d2c41a965d82ce29
          rustup update stable
          rustup default stable
          rustc --version
          git rev-parse HEAD > "$RUNNER_TEMP/encoder-revision.txt"
          cargo build --locked --release -p atracdenc-cli
          ffmpeg -v error -f lavfi -i 'sine=frequency=440:duration=8' -ar 44100 -ac 2 -c:a pcm_s16le "$RUNNER_TEMP/test.wav"
          target/release/atracdenc -e atrac3-lp4 --container riff -i "$RUNNER_TEMP/test.wav" -o "$RUNNER_TEMP/test.at3"
          ffprobe -v error -show_entries stream=codec_name,sample_rate,channels -of json "$RUNNER_TEMP/test.at3" | tee "$RUNNER_TEMP/encoder-probe.json"
          python3 -c 'import json,sys; s=json.load(open(sys.argv[1]))["streams"][0]; assert s["codec_name"]=="atrac3" and int(s["sample_rate"])==44100 and s["channels"]==2, s' "$RUNNER_TEMP/encoder-probe.json"
          ffmpeg -v error -i "$RUNNER_TEMP/test.at3" -f null -
      - name: Cross compile Android ARM64 encoder
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/atracdenc"
          rustup target add aarch64-linux-android
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          cargo build --locked --release -p atracdenc-cli --target aarch64-linux-android
          mkdir -p "$GITHUB_WORKSPACE/RotateRadio/app/src/main/jniLibs/arm64-v8a"
          cp target/aarch64-linux-android/release/atracdenc "$GITHUB_WORKSPACE/RotateRadio/app/src/main/jniLibs/arm64-v8a/libatracdenc.so"
          file "$GITHUB_WORKSPACE/RotateRadio/app/src/main/jniLibs/arm64-v8a/libatracdenc.so"
      - name: Assemble debug APK
        working-directory: RotateRadio
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare distribution and exact encoder source
        shell: bash
        run: |
          mkdir -p dist
          cp RotateRadio/app/build/outputs/apk/debug/app-debug.apk dist/RotateRadio-v0.3.0-alpha.apk
          cp RotateRadio/README.md dist/
          cp "$RUNNER_TEMP/encoder-revision.txt" dist/
          cp "$RUNNER_TEMP/test.at3" dist/encoder-smoke-test.at3
          cp "$RUNNER_TEMP/encoder-probe.json" dist/
          git -C "$RUNNER_TEMP/atracdenc" archive --format=tar.gz --output="$GITHUB_WORKSPACE/dist/atracdenc-source.tar.gz" HEAD
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/RotateRadio-v0.3.0-alpha.apk
          unzip -l dist/RotateRadio-v0.3.0-alpha.apk | grep 'lib/arm64-v8a/libatracdenc.so'
          (cd dist && sha256sum RotateRadio-v0.3.0-alpha.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: RotateRadio-v0.3.0-alpha
          path: dist/
          if-no-files-found: error
