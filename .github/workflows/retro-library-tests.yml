name: Retro Library Studio tests

on:
  push:
    branches: [main]
    paths:
      - "RetroLibraryStudio/**"
      - ".github/workflows/retro-library-tests.yml"
  pull_request:
    paths:
      - "RetroLibraryStudio/**"
      - ".github/workflows/retro-library-tests.yml"
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    defaults:
      run:
        working-directory: RetroLibraryStudio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: RetroLibraryStudio/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run regression tests
        run: python -m pytest -q --disable-warnings --maxfail=1
      - name: Scope reminder
        if: always()
        run: python -c "print('CI verifies source tests only. It does not verify real CHDman images, Synology SMB, a microSD card, or an RG Rotate.')"
