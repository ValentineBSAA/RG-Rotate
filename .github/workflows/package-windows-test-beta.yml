name: Package v1.6.3 Windows test ZIP
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/package-windows-test-beta.yml"
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # v1.6.3 fix-candidate source artifact. Real Windows Stop and game-title tests pending.
      # v1.6.3 candidate after regression corrections: checked-out SHA only; do not infer Windows NAS acceptance.
      # Package checked-out branch or main source; do not claim physical Windows acceptance.
      - name: Package checked-out source without altering existing installs
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          root = pathlib.Path('.')
          out_dir = root / 'dist'
          out_dir.mkdir(exist_ok=True)
          dest = out_dir / 'RetroLibraryStudio_v1.6.3_Windows_Test_Beta.zip'
          text = (
              'RETRO LIBRARY STUDIO v1.6.3 - WINDOWS SOURCE TEST BETA\n'
              'This is a source beta (Python 3 + dependencies), NOT a compiled EXE.\n'
              '1. Extract the ZIP into a NEW folder separate from your old working build.\n'
              '2. Open the RetroLibraryStudio folder.\n'
              '3. Double-click Start_Retro_Library_Studio.bat. Install Python dependencies if prompted.\n'
              '4. Select your EXISTING virtual NAS card location. Do not format or delete anything.\n'
              '5. STOP old 1.6.2 batch before running this new build against the SAME workspace.\n'
              '6. Inspect any old PS1/Disc 1.chd files; NEVER auto-rename or delete them.\n'
              '7. Test a few DISPOSABLE PSN packages first; game title must be correctly detected.\n'
              '8. Use Open game folder on My Games tiles; Stop task must prevent next package.\n'
              '6. Retry a renamed ZIP/7Z containing the same EBOOT. Verify it is skipped with one tile.\n'
              'PS2/GameCube folders only organize files; performance is experimental.\n'
              'CHD batch delete is for disposable copies until real Windows verification.\n'
              'v1.6.3 checks: docs/PS1_BATCH_IDENTITY_AND_STOP_v163.md; full checklist: docs/FULL_TEST_CHECKLIST.md\n'
              'GitHub CI does not establish real NAS or RG Rotate acceptance.\n'
          )
          with zipfile.ZipFile(dest,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for base in ('RetroLibraryStudio', 'docs'):
                  for p in sorted((root/base).rglob('*')):
                      if not p.is_file(): continue
                      if any(part in ('.git', '.pytest_cache', '__pycache__', '.venv', 'logs', '.retro-library') for part in p.parts): continue
                      if p.suffix in ('.pyc', '.pyo'): continue
                      z.write(p,p.as_posix())
              z.write(root/'README.md','README_GITHUB.md')
              z.writestr('READ_ME_FIRST_v1.6.3.txt',text)
              z.writestr('BUILD_METADATA.json',json.dumps({
                  'version':'1.6.3', 'platform':'Windows source beta',
                  'commit':os.environ.get('GITHUB_SHA',''),
                  'real_windows_nas_acceptance':'pending',
                  'real_RG_Rotate_acceptance':'pending',
                  'previous_real_windows_observation':'v1.5.7 console UI and 512 GB meter; v1.5.4 individual PS1 CHDs',
                  'run_tests':'RUN_TESTS_Windows.bat in RetroLibraryStudio'
              },indent=2))
          with zipfile.ZipFile(dest) as z:
              assert z.testzip() is None
              for name in ('RetroLibraryStudio/Start_Retro_Library_Studio.bat',
                           'RetroLibraryStudio/app.py',
                           'RetroLibraryStudio/system_shelves.py',
                           'RetroLibraryStudio/virtual_exfat.py',
                           'RetroLibraryStudio/friendly_dialogs.py',
                           'RetroLibraryStudio/ps1_psn.py',
                           'RetroLibraryStudio/ps1_progress.py',
                           'RetroLibraryStudio/ps1_batch.py',
                           'RetroLibraryStudio/tests/test_v162_psn_batch.py',
                           'RetroLibraryStudio/tests/test_v163_ps1_title_stop.py',
                           'RetroLibraryStudio/ps1_duplicates.py',
                           'RetroLibraryStudio/library_duplicates.py',
                           'RetroLibraryStudio/tests/test_v162_library_duplicates.py',
                           'docs/LIBRARY_DEDUP_AND_PS1_PROGRESS.md',
                           'docs/PS1_BATCH_IDENTITY_AND_STOP_v163.md',
                           'RetroLibraryStudio/tests/test_v161_psn_and_7z.py',
                           'docs/PSN_CLASSICS_IMPORT.md',
                           'RetroLibraryStudio/ps1_psn.py',
                           'RetroLibraryStudio/tests/test_v161_psn_and_7z.py',
                           'RetroLibraryStudio/tests/test_v161_psxtract_setup.py',
                           'docs/PS1_CLASSICS_7Z_ACCEPTANCE.md',
                           'RetroLibraryStudio/card_identity.py',
                           'RetroLibraryStudio/tests/test_v160_readable_cards.py',
                           'docs/CARD_DETECTION_AND_READABLE_DIALOGS.md',
                           'RetroLibraryStudio/ps1_collections.py',
                           'RetroLibraryStudio/tests/test_v159_exfat_and_playlist.py',
                           'docs/VIRTUAL_EXFAT_PLAN.md',
                           'RetroLibraryStudio/ps1_collections.py',
                           'docs/MULTIDISC_ACCEPTANCE.md',
                           'docs/FULL_TEST_CHECKLIST.md'):
                  assert name in z.namelist(), name
              assert len(z.namelist()) > 60
              print('ZIP entries:', len(z.namelist()))
          print('ZIP size:', dest.stat().st_size)
          print('SHA256:', hashlib.sha256(dest.read_bytes()).hexdigest())
          PY
      - name: Upload test beta ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RetroLibraryStudio_v1.6.3_Windows_Test_Beta
          path: dist/RetroLibraryStudio_v1.6.3_Windows_Test_Beta.zip
          if-no-files-found: error
          retention-days: 30
